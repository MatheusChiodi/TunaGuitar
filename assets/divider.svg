<svg width="900" height="36" viewBox="0 0 900 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="separador">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5555" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF5555" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF5555" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="900" height="36" fill="url(#fade)"/></mask>
  </defs>
  <g mask="url(#m)">
    <g transform="translate(0,18)">
      <!-- barras de equalizador animadas -->
      <g fill="#FF5555">
        <rect x="120" y="-3"  width="3" height="6"  rx="1.5"><animate attributeName="height" values="6;16;6"  dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="-3;-8;-3" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect x="132" y="-5"  width="3" height="10" rx="1.5"><animate attributeName="height" values="10;22;10" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="-5;-11;-5" dur="0.9s" repeatCount="indefinite"/></rect>
        <rect x="144" y="-7"  width="3" height="14" rx="1.5"><animate attributeName="height" values="14;26;14" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="-7;-13;-7" dur="1.4s" repeatCount="indefinite"/></rect>
        <rect x="156" y="-4"  width="3" height="8"  rx="1.5"><animate attributeName="height" values="8;18;8"  dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="-4;-9;-4" dur="1.0s" repeatCount="indefinite"/></rect>
      </g>
      <line x1="0" y1="0" x2="900" y2="0" stroke="#FF5555" stroke-width="1" opacity="0.5"/>
      <circle cx="450" cy="0" r="3.5" fill="#FF5555"/>
      <g fill="#FF5555">
        <rect x="744" y="-3" width="3" height="6"  rx="1.5"><animate attributeName="height" values="6;16;6"  dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-3;-8;-3" dur="1.1s" repeatCount="indefinite"/></rect>
        <rect x="756" y="-7" width="3" height="14" rx="1.5"><animate attributeName="height" values="14;26;14" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="-7;-13;-7" dur="1.5s" repeatCount="indefinite"/></rect>
        <rect x="768" y="-5" width="3" height="10" rx="1.5"><animate attributeName="height" values="10;22;10" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="-5;-11;-5" dur="0.95s" repeatCount="indefinite"/></rect>
        <rect x="780" y="-3" width="3" height="6"  rx="1.5"><animate attributeName="height" values="6;15;6"  dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="-3;-8;-3" dur="1.25s" repeatCount="indefinite"/></rect>
