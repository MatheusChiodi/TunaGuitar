<svg width="900" height="330" viewBox="0 0 900 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arquitetura do TunaGuitar">
  <defs>
    <filter id="aglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9490A0"/>
    </marker>
    <style>
      .flow { stroke-dasharray: 5 6; animation: dash 1.1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -22; } }
      .mono { font-family: ui-monospace,'JetBrains Mono',monospace; }
    </style>
  </defs>

  <rect width="900" height="330" rx="14" fill="#05050A"/>
  <rect x="0.5" y="0.5" width="899" height="329" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <text x="450" y="30" class="mono" font-size="11" fill="#5A5868" text-anchor="middle" letter-spacing="3">VISÃO DE ARQUITETURA · TUDO LOCAL, NADA SAI DO NAVEGADOR</text>

  <!-- Microfone -->
  <rect x="34" y="128" width="128" height="74" rx="10" fill="#14141C" stroke="#FF5555" stroke-width="1.5"/>
  <text x="98" y="160" class="mono" font-size="12.5" fill="#F0EBE0" text-anchor="middle" font-weight="700">🎤 Microfone</text>
  <text x="98" y="178" class="mono" font-size="9.5" fill="#9490A0" text-anchor="middle">getUserMedia</text>
  <text x="98" y="192" class="mono" font-size="8.5" fill="#4A4858" text-anchor="middle">captura de entrada</text>

  <line x1="162" y1="165" x2="206" y2="165" class="flow" stroke="#FF5555" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Web Audio -->
  <rect x="208" y="118" width="140" height="94" rx="10" fill="#14141C" stroke="#F5A623" stroke-width="1.5"/>
  <text x="278" y="150" class="mono" font-size="12.5" fill="#F0EBE0" text-anchor="middle" font-weight="700">Web Audio API</text>
  <text x="278" y="168" class="mono" font-size="9.5" fill="#9490A0" text-anchor="middle">AnalyserNode · Oscillator</text>
  <text x="278" y="184" class="mono" font-size="9.5" fill="#F5A623" text-anchor="middle">autocorrelação ACF2+</text>
  <text x="278" y="200" class="mono" font-size="8.5" fill="#4A4858" text-anchor="middle">detecção + síntese</text>

  <line x1="348" y1="165" x2="392" y2="165" class="flow" stroke="#F5A623" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- React Core (hero) -->
  <rect x="394" y="104" width="158" height="122" rx="12" fill="#1A0E10" stroke="#FF5555" stroke-width="2" filter="url(#aglow)"/>
  <rect x="394" y="104" width="158" height="122" rx="12" fill="none" stroke="#FF5555" stroke-opacity="0.35" stroke-dasharray="4 3"/>
  <text x="473" y="142" class="mono" font-size="14" fill="#FF5555" text-anchor="middle" font-weight="700">React 19 Core</text>
  <text x="473" y="162" class="mono" font-size="9.5" fill="#C9C5D2" text-anchor="middle">TypeScript + Vite 7</text>
  <text x="473" y="180" class="mono" font-size="9.5" fill="#9490A0" text-anchor="middle">Context: Settings · Gamify</text>
  <text x="473" y="196" class="mono" font-size="9.5" fill="#9490A0" text-anchor="middle">React Router · 15 rotas lazy</text>
  <text x="473" y="214" class="mono" font-size="8.5" fill="#4A4858" text-anchor="middle">hooks · libs de teoria musical</text>

  <!-- setas para saídas -->
  <line x1="552" y1="130" x2="606" y2="92"  class="flow" stroke="#3DCA7A" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="552" y1="158" x2="606" y2="150" class="flow" stroke="#5B9CF6" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="552" y1="186" x2="606" y2="210" class="flow" stroke="#C58CF0" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="552" y1="206" x2="606" y2="270" class="flow" stroke="#9490A0" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- localStorage -->
  <rect x="608" y="58" width="150" height="56" rx="9" fill="#14141C" stroke="#3DCA7A" stroke-width="1.4"/>
  <text x="683" y="84" class="mono" font-size="11.5" fill="#3DCA7A" text-anchor="middle" font-weight="700">localStorage</text>
  <text x="683" y="100" class="mono" font-size="8.5" fill="#4A4858" text-anchor="middle">config · XP · diário · cifras</text>

  <!-- Chart.js / Canvas -->
  <rect x="608" y="124" width="150" height="52" rx="9" fill="#14141C" stroke="#5B9CF6" stroke-width="1.4"/>
  <text x="683" y="147" class="mono" font-size="11.5" fill="#5B9CF6" text-anchor="middle" font-weight="700">Chart.js · Canvas</text>
  <text x="683" y="163" class="mono" font-size="8.5" fill="#4A4858" text-anchor="middle">gráficos · heatmap</text>

  <!-- SVG / Motion -->
  <rect x="608" y="186" width="150" height="52" rx="9" fill="#14141C" stroke="#C58CF0" stroke-width="1.4"/>
  <text x="683" y="209" class="mono" font-size="11.5" fill="#C58CF0" text-anchor="middle" font-weight="700">SVG · Framer Motion</text>
  <text x="683" y="225" class="mono" font-size="8.5" fill="#4A4858" text-anchor="middle">diagramas · GSAP · tsParticles</text>

  <!-- DOM / Tailwind -->
  <rect x="608" y="248" width="150" height="52" rx="9" fill="#14141C" stroke="#9490A0" stroke-width="1.4"/>
  <text x="683" y="271" class="mono" font-size="11.5" fill="#9490A0" text-anchor="middle" font-weight="700">DOM · Tailwind 4</text>
  <text x="683" y="287" class="mono" font-size="8.5" fill="#4A4858" text-anchor="middle">UI responsiva · temas</text>

  <line x1="758" y1="165" x2="800" y2="165" class="flow" stroke="#9490A0" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Output -->
  <rect x="802" y="118" width="64" height="94" rx="9" fill="#14141C" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="834" y="150" font-size="16" text-anchor="middle">🖥️</text>
  <text x="834" y="174" font-size="16" text-anchor="middle">🔊</text>
  <text x="834" y="198" font-size="16" text-anchor="middle">💾</text>
</svg>
