<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TunaGuitar — Suíte de prática para violão e guitarra no navegador">
  <defs>
    <radialGradient id="glowL" cx="18%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#FF5555" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#05050A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="88%" cy="6%" r="48%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#05050A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F0EBE0"/>
      <stop offset="100%" stop-color="#8E8AA0"/>
    </linearGradient>
    <linearGradient id="accentSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5555" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF5555" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF5555" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5555" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF5555" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF5555" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5555"/>
      <stop offset="100%" stop-color="#FF5555" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1280" height="360" fill="#05050A"/>
  <rect width="1280" height="360" fill="url(#glowL)"/>
  <rect width="1280" height="360" fill="url(#glowR)"/>

  <!-- Headstock + cordas vibrando (esquerda) -->
  <g transform="translate(48,40)" opacity="0.10">
    <rect x="95" y="78" width="28" height="230" rx="4" fill="#FF5555"/>
    <ellipse cx="109" cy="70" rx="50" ry="74" fill="#FF5555"/>
    <circle cx="60" cy="38" r="9" fill="none" stroke="#FF5555" stroke-width="3"/>
    <circle cx="60" cy="72" r="9" fill="none" stroke="#FF5555" stroke-width="3"/>
    <circle cx="60" cy="106" r="9" fill="none" stroke="#FF5555" stroke-width="3"/>
    <circle cx="158" cy="38" r="9" fill="none" stroke="#FF5555" stroke-width="3"/>
    <circle cx="158" cy="72" r="9" fill="none" stroke="#FF5555" stroke-width="3"/>
    <circle cx="158" cy="106" r="9" fill="none" stroke="#FF5555" stroke-width="3"/>
    <rect x="90" y="144" width="38" height="5" rx="1" fill="#FF5555"/>
    <rect x="90" y="170" width="38" height="2" fill="#FF5555" opacity="0.5"/>
    <rect x="90" y="196" width="38" height="2" fill="#FF5555" opacity="0.5"/>
    <rect x="90" y="222" width="38" height="2" fill="#FF5555" opacity="0.5"/>
    <rect x="90" y="248" width="38" height="2" fill="#FF5555" opacity="0.5"/>
  </g>

  <!-- 6 cordas com leve vibração -->
  <g transform="translate(48,40)" stroke="#FF5555" opacity="0.55" stroke-linecap="round">
    <line x1="99"  y1="150" x2="99"  y2="308" stroke-width="1">
      <animate attributeName="stroke-width" values="1;1.8;1" dur="1.7s" repeatCount="indefinite"/>
    </line>
    <line x1="105" y1="150" x2="105" y2="308" stroke-width="1.1">
      <animate attributeName="stroke-width" values="1.1;2;1.1" dur="2.1s" repeatCount="indefinite"/>
    </line>
    <line x1="111" y1="150" x2="111" y2="308" stroke-width="1.2">
      <animate attributeName="stroke-width" values="1.2;2.2;1.2" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <line x1="117" y1="150" x2="117" y2="308" stroke-width="1.3">
      <animate attributeName="stroke-width" values="1.3;2.4;1.3" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="123" y1="150" x2="123" y2="308" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.6;1.5" dur="1.9s" repeatCount="indefinite"/>
    </line>
    <line x1="129" y1="150" x2="129" y2="308" stroke-width="1.6">
      <animate attributeName="stroke-width" values="1.6;2.8;1.6" dur="1.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Medidor de afinação com agulha oscilando (direita) -->
  <g transform="translate(1010,210)" opacity="0.9">
    <path d="M -150 0 A 150 150 0 0 1 150 0" fill="none" stroke="#FF5555" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <path d="M -150 0 A 150 150 0 0 1 -52 -141" fill="none" stroke="#3DCA7A" stroke-width="3" stroke-linecap="round" opacity="0.0">
      <animate attributeName="opacity" values="0;0.7;0" dur="4s" repeatCount="indefinite"/>
    </path>
    <g stroke-linecap="round">
      <line x1="0" y1="-150" x2="0" y2="-134" stroke="#3DCA7A" stroke-width="2.5"/>
      <line x1="0" y1="-150" x2="0" y2="-138" stroke="#9490A0" stroke-width="1.5" transform="rotate(-20)"/>
      <line x1="0" y1="-150" x2="0" y2="-138" stroke="#9490A0" stroke-width="1.5" transform="rotate(20)"/>
      <line x1="0" y1="-150" x2="0" y2="-138" stroke="#F5A623" stroke-width="1.5" transform="rotate(-40)"/>
      <line x1="0" y1="-150" x2="0" y2="-138" stroke="#F5A623" stroke-width="1.5" transform="rotate(40)"/>
      <line x1="0" y1="-150" x2="0" y2="-138" stroke="#FF5555" stroke-width="1.5" transform="rotate(-60)"/>
      <line x1="0" y1="-150" x2="0" y2="-138" stroke="#FF5555" stroke-width="1.5" transform="rotate(60)"/>
    </g>
    <!-- agulha animada -->
    <g>
      <line x1="0" y1="6" x2="0" y2="-138" stroke="url(#needleGrad)" stroke-width="3" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-46; 28; -14; 6; -2; 0; -3; 2; -46"
        keyTimes="0; 0.18; 0.34; 0.48; 0.6; 0.72; 0.84; 0.92; 1"
        dur="6s" repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.3 0 0.2 1; 0.3 0 0.2 1; 0.3 0 0.2 1; 0.3 0 0.2 1; 0.3 0 0.2 1; 0.3 0 0.2 1; 0.3 0 0.2 1; 0.3 0 0.2 1"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="#FF5555"/>
    <circle cx="0" cy="0" r="4" fill="#F0EBE0"/>
    <text x="0" y="-58" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#3DCA7A" text-anchor="middle" font-weight="700" letter-spacing="2" opacity="0">
      IN TUNE
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.66;0.74;0.86;0.94" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Waveform animada (base) -->
  <g transform="translate(360,326)" opacity="0.5">
    <path fill="none" stroke="#FF5555" stroke-width="2" stroke-linecap="round"
      d="M0 0 Q30 -22 60 0 T120 0 T180 0 T240 0 T300 0 T360 0 T420 0 T480 0 T540 0">
      <animate attributeName="d" dur="2.2s" repeatCount="indefinite"
        values="M0 0 Q30 -22 60 0 T120 0 T180 0 T240 0 T300 0 T360 0 T420 0 T480 0 T540 0;
                M0 0 Q30 18 60 0 T120 0 T180 0 T240 0 T300 0 T360 0 T420 0 T480 0 T540 0;
                M0 0 Q30 -22 60 0 T120 0 T180 0 T240 0 T300 0 T360 0 T420 0 T480 0 T540 0"/>
    </path>
  </g>

  <!-- Notas musicais subindo -->
  <g font-family="serif" fill="#FF5555">
    <text x="250" y="300" font-size="30" opacity="0.0">♪
      <animate attributeName="y" values="305;235" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="300" font-size="22" opacity="0.0">♩
      <animate attributeName="y" values="310;250" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.35;0" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="210" y="300" font-size="26" opacity="0.0">♫
      <animate attributeName="y" values="300;240" dur="5.5s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="5.5s" begin="2.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Título -->
  <text x="360" y="160" font-family="'Segoe UI',Roboto,system-ui,sans-serif" font-size="84" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Tuna<tspan fill="#FF5555">Guitar</tspan></text>
  <text x="364" y="200" font-family="'Segoe UI',system-ui,sans-serif" font-size="18" fill="#B6B2C2" letter-spacing="3">SUÍTE COMPLETA DE PRÁTICA PARA VIOLÃO E GUITARRA</text>
  <text x="364" y="226" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#5A5868" letter-spacing="1">React 19  ·  TypeScript  ·  Web Audio API  ·  100% no navegador</text>

  <!-- linha de destaque com varredura -->
  <rect x="364" y="244" width="520" height="2" rx="1" fill="url(#lineGrad)"/>
  <rect x="364" y="244" width="120" height="2" rx="1" fill="url(#accentSweep)">
    <animate attributeName="x" values="364;764;364" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Badges de stack -->
  <g transform="translate(364,266)" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" letter-spacing="0.5">
    <g>
      <rect x="0" y="0" width="74" height="26" rx="6" fill="#14141C" stroke="#FF5555" stroke-opacity="0.35"/>
      <text x="37" y="17" fill="#FF7A7A" text-anchor="middle">15 módulos</text>
    </g>
    <g transform="translate(84,0)">
      <rect x="0" y="0" width="92" height="26" rx="6" fill="#14141C" stroke="#FF5555" stroke-opacity="0.35"/>
      <text x="46" y="17" fill="#FF7A7A" text-anchor="middle">offline-first</text>
    </g>
    <g transform="translate(186,0)">
      <rect x="0" y="0" width="92" height="26" rx="6" fill="#14141C" stroke="#FF5555" stroke-opacity="0.35"/>
      <text x="46" y="17" fill="#FF7A7A" text-anchor="middle">PT-BR / EN</text>
    </g>
    <g transform="translate(288,0)">
      <rect x="0" y="0" width="108" height="26" rx="6" fill="#14141C" stroke="#FF5555" stroke-opacity="0.35"/>
      <text x="54" y="17" fill="#FF7A7A" text-anchor="middle">áudio sintetizado</text>
    </g>
  </g>

  <!-- borda inferior -->
  <rect x="0" y="358" width="1280" height="2" fill="url(#lineGrad)"/>
</svg>
