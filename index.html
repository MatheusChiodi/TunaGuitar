    <script type="application/ld+json">

          {
            "@type": "Question",
            "name": "Como afinar o violão pelo microfone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Permita o acesso ao microfone quando o navegador solicitar, toque uma corda do violão e o TunaGuitar mostra em tempo real se a nota está afinada, alta ou baixa. Ajuste a corda até o indicador ficar verde."

          },
          {
            "@type": "Question",
            "name": "O afinador de violão online é grátis?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim, o TunaGuitar é 100% grátis, sem anúncios e sem necessidade de criar conta ou instalar aplicativo. Funciona direto no navegador do celular ou computador."
            }
          },
          {
            "@type": "Question",
            "name": "Preciso instalar algum aplicativo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. O TunaGuitar funciona inteiramente no navegador usando a Web Audio API. Basta abrir o site e permitir o microfone."
            }
          },
          {
            "@type": "Question",
            "name": "Qual é a afinação padrão do violão?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A afinação padrão do violão é E-A-D-G-B-E (Mi, Lá, Ré, Sol, Si, Mi), da sexta corda mais grave até a primeira mais aguda. O TunaGuitar também suporta afinações alternativas como Drop D e Open G."
            }
          },
          {
            "@type": "Question",
            "name": "O afinador funciona no celular?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. O TunaGuitar funciona em qualquer celular Android ou iPhone através do navegador, usando o microfone do aparelho. Também pode ser adicionado à tela inicial como um app."
            }
          }
